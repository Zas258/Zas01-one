<?xml version="1.0" encoding="UTF-8"?>
<!-- 黑白灰图形徽章：一个圆（面）、几条线、几个点，中间是昵称首字。
     想换成真实照片：把图片放进 assets/，再改 app.js 里的 PROFILE.avatar 即可。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="王权业的头像徽章">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161a" stop-opacity="0.06"/>
      <stop offset="0.6" stop-color="#14161a" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#14161a" stop-opacity="0.09"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="36%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" fill="#fbfbf9"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#wash)"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#glow)"/>

  <!-- 面：一个圆 -->
  <circle cx="100" cy="100" r="66" fill="none" stroke="#14161a" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="100" cy="100" r="50" fill="none" stroke="#14161a" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- 线：十字准星 -->
  <g stroke="#14161a" stroke-opacity="0.5" stroke-width="1">
    <line x1="100" y1="14" x2="100" y2="42"/>
    <line x1="100" y1="158" x2="100" y2="186"/>
    <line x1="14" y1="100" x2="42" y2="100"/>
    <line x1="158" y1="100" x2="186" y2="100"/>
  </g>

  <!-- 点：大小不一的墨点 -->
  <circle cx="100" cy="34" r="3.4" fill="#14161a"/>
  <circle cx="166" cy="100" r="2.2" fill="#14161a" fill-opacity="0.75"/>
  <circle cx="100" cy="166" r="2.8" fill="#14161a" fill-opacity="0.9"/>
  <circle cx="34" cy="100" r="1.8" fill="#14161a" fill-opacity="0.6"/>
  <circle cx="142" cy="58" r="2.6" fill="#14161a" fill-opacity="0.85"/>
  <circle cx="58" cy="142" r="2" fill="#14161a" fill-opacity="0.7"/>

  <!-- 昵称首字 -->
  <text x="100" y="104" text-anchor="middle" dominant-baseline="middle"
        font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif"
        font-size="58" font-weight="700" fill="#14161a">王</text>
</svg>
